<style>
/* Layout: teal side rail + working area; one screen at a time; record drawer slides over on the right. */
:root{
  --bg:#F4F6F5; --surface:#FFFFFF; --surface-2:#F0F3F2; --line:#DCE3E0; --line-soft:#EDF1EF;
  --fg:#15211F; --fg-2:#3C4946; --muted:#55625F;
  --rail:#10302C; --rail-fg:#E4EEEB; --rail-muted:#B5C9C3; --rail-active:#1D4A44;
  --accent:#0E6B63; --accent-fg:#FFFFFF; --accent-soft:#E4F0EE;
  --ok:#24532F; --ok-bg:#E3F1E6; --warn:#8A3B00; --warn-bg:#FDEBD8; --info:#134B8A; --info-bg:#E1ECF9;
  --crit:#A1241C; --crit-bg:#FBE9E7; --crit-fg:#FFFFFF;
  --font-ui:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-data:'IBM Plex Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1716; --surface:#152220; --surface-2:#1B2B28; --line:#2A3C39; --line-soft:#213330;
  --fg:#E6EEEC; --fg-2:#C3D1CD; --muted:#9AAEA9;
  --rail:#0A1F1C; --rail-fg:#E4EEEB; --rail-muted:#9DB5AF; --rail-active:#1D4A44;
  --accent:#3FB3A6; --accent-fg:#06211E; --accent-soft:#163A36;
  --ok:#8FD6A0; --ok-bg:#16301E; --warn:#F2B66B; --warn-bg:#3A2610; --info:#9CC3F0; --info-bg:#132940;
  --crit:#FF8A80; --crit-bg:#3B1512; --crit-fg:#2A0906; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1716; --surface:#152220; --surface-2:#1B2B28; --line:#2A3C39; --line-soft:#213330;
  --fg:#E6EEEC; --fg-2:#C3D1CD; --muted:#9AAEA9;
  --rail:#0A1F1C; --rail-fg:#E4EEEB; --rail-muted:#9DB5AF; --rail-active:#1D4A44;
  --accent:#3FB3A6; --accent-fg:#06211E; --accent-soft:#163A36;
  --ok:#8FD6A0; --ok-bg:#16301E; --warn:#F2B66B; --warn-bg:#3A2610; --info:#9CC3F0; --info-bg:#132940;
  --crit:#FF8A80; --crit-bg:#3B1512; --crit-fg:#2A0906; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font-ui);font-size:15px;line-height:1.45}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--font-data);font-variant-numeric:tabular-nums}
.app{display:flex;min-height:100%}
.rail{flex:0 0 228px;background:var(--rail);color:var(--rail-fg);display:flex;flex-direction:column;gap:4px;padding-block:20px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:14px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px 18px}

.nav button[aria-current="page"]{color:#fff;background:var(--rail-active);font-weight:600}
.nav button:focus-visible{outline:2px solid #7FD1C4}
.count{font-family:var(--font-data);font-size:12px;padding:1px 8px;border-radius:999px;background:#173B36;color:#CFE3DE}
.count.hot{background:#F2B66B;color:#2A1600}
.railfoot{margin-top:auto;display:flex;flex-direction:column;gap:10px}
.railcard{padding:12px;border-radius:10px;background:#173B36;font-size:12.5px;color:var(--rail-muted);display:flex;flex-direction:column;gap:4px}

.topbar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding-block:14px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--surface)}

.who{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.view{padding-block:26px 48px;padding-left:28px;padding-right:max(28px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px;max-width:1280px;width:100%}
.eyebrow{font-size:13px;color:var(--muted);font-weight:500}
h1{margin:0;font-size:28px;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:16.5px;font-weight:600}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}

.p-ok{background:var(--ok-bg);color:var(--ok)} .p-warn{background:var(--warn-bg);color:var(--warn)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:640px}
th{text-align:left;font-size:12px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line)}
td{padding:11px 10px;border-bottom:1px solid var(--line-soft);font-size:14px;vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:var(--surface-2)}
.btn{min-height:42px;padding:0 16px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:600;display:inline-flex;align-items:center;gap:8px}

.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}

.filters{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13.5px}

.note{font-size:13px;color:var(--muted);line-height:1.5;margin:0}
.exc{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:var(--r);padding:16px 18px;background:var(--surface)}

.exc header{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;align-items:center}

.actions{display:flex;flex-wrap:wrap;gap:10px}
.cite{font-size:12.5px;color:var(--muted)}

.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--font-data);font-size:11px}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
.sw{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.drawer{position:fixed;inset:0;display:flex;justify-content:flex-end;background:rgba(6,20,18,.45);z-index:20}
.drawer[hidden]{display:none!important}
.sheet{width:min(720px,100%);height:100%;overflow-y:auto;background:var(--bg);border-left:1px solid var(--line);padding-block:calc(22px + env(safe-area-inset-top,0px)) calc(28px + env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.rows{display:flex;flex-direction:column}
.rrow{display:grid;grid-template-columns:1.7fr 1.1fr 1.3fr .9fr;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line-soft);font-size:14px}

.checks{display:flex;flex-direction:column;gap:8px}

.check i{font-style:normal;font-family:var(--font-data);font-size:12px;padding:1px 7px;border-radius:4px;background:var(--ok-bg);color:var(--ok);flex:none}
.check i.bad{background:var(--crit-bg);color:var(--crit)}
.proc{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.proc p{margin:0;font-size:14px}
.audit td:first-child{white-space:nowrap}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{display:flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;font-weight:600;font-size:14px}
.seg input{accent-color:var(--accent)}
.toggle{display:flex;align-items:center;gap:12px;font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface);resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:12px 18px;border-radius:10px;font-weight:600;font-size:14px;z-index:30;max-width:calc(100% - 32px)}
@media (max-width:860px){
  .app{flex-direction:column}
  .rail{flex:none;padding-block:12px;padding-right:max(14px,env(safe-area-inset-right,0px))}
  .brand{padding-bottom:10px}
  .nav{flex-direction:row;overflow-x:auto;gap:4px}
  .nav button{white-space:nowrap;padding:9px 12px}
  .railfoot{display:none}
  .topbar,.view{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  h1{font-size:23px}
  .rrow{grid-template-columns:1.4fr 1fr 1fr;}.rrow .ref{display:none}
}
@media (prefers-reduced-motion:no-preference){.sheet{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}}}

<script>
const DATA = /*DATA*/null;
const IMG = /*IMG*/null;
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const T = s => s ? new Date(s) : null;
const NOW = new Date('2026-10-10T17:50+01:00');
const fmt = d => d ? d.toLocaleString('en-GB',{weekday:'short',day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}) : '—';
const fmtT = d => d ? d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',timeZone:'Africa/Lagos'}) : '—';
const mins = (a, b) => (b - a) / 60000;
const median = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1] + s[m]) / 2; };
const hm = m => m == null ? '—' : (m >= 60 ? `${Math.floor(m/60)} h ${String(Math.round(m%60)).padStart(2,'0')} m` : `${Math.round(m)} m`);

// ── State ─────────────────────────────────────────────────────────────────
const staff = Object.fromEntries(DATA.staff.map(s => [s.id, s]));
const patients = Object.fromEntries(DATA.patients.map(p => [p.id, p]));
const catalog = {}; DATA.test_catalog.forEach(c => (catalog[c.code] ||= []).push(c));
const cat = (code, sex) => (catalog[code] || []).find(c => c.ref_sex === sex) || (catalog[code] || [])[0] || {};
const results = DATA.results.map(r => ({...r}));
const orders = DATA.orders.map(o => ({...o, results: results.filter(r => r.order_id === o.id)}));
const state = { view: 'dashboard', user: 'STF-001', filter: 'all', model: 'local', comments: false, audit: [] };
const exceptions = buildExceptions();

function audit(action, detail, actor = 'human') {
  state.audit.unshift({ at: new Date(), actor: actor === 'gaya' ? 'Gaya' : staff[state.user].display_name, kind: actor, action, detail, model: actor === 'gaya' ? state.model : '' });
}
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
const isChief = () => staff[state.user].role === 'chief_scientist';
const modelLabel = m => ({ local: 'Local model (on this PC)', byo: 'Your own API key', connect: 'MitochronAi Connect' }[m]);

// ── Gaya's deterministic checks (mirror scripts/validate_data.py) ──────────
const ROSTER = new Set(DATA.duty_roster.map(r => `${r.staff_id}|${r.weekday}`));
const isoDay = d => ((d.getUTCDay() + 6) % 7) + 1; // times are WAT (+01:00); day boundary unaffected inside opening hours
function checksFor(o) {
  const p = patients[o.patient_id], out = [];
  const by = Object.fromEntries(o.results.map(r => [r.test_code, r]));
  o.results.forEach(r => {
    const tt = T(r.tested_at);
    if (r.performed_by && tt) out.push({ ok: ROSTER.has(`${r.performed_by}|${isoDay(tt)}`), text: `${r.test_code}: ${staff[r.performed_by]?.display_name || '—'} on the duty roster for ${tt.toLocaleDateString('en-GB',{weekday:'long',timeZone:'Africa/Lagos'})}` });
    const c = cat(r.test_code, p.sex);
    if (r.unit && c.unit !== undefined) out.push({ ok: r.unit === c.unit, text: `${r.test_code}: unit ${r.unit} matches the catalogue` });
    if (r.test_code === 'MANTOUX' && r.read_at) {
      const h = (T(r.read_at) - T(r.collected_at)) / 3.6e6, cut = p.risk_factors ? 5 : 10;
      out.push({ ok: h >= 48 && h <= 72, text: `Mantoux read at ${h.toFixed(1)} h (window 48–72 h)` });
      out.push({ ok: r.flag === (+r.value_numeric >= cut ? 'POS' : 'NEG'), text: `Mantoux ${r.value_numeric} mm judged at the ≥ ${cut} mm cut-off${p.risk_factors ? ' (risk factor on file)' : ''}` });
    }
  });
  if (by.TC && by.HDL && by.TG && by.LDL) {
    const f = +by.TC.value_numeric - +by.HDL.value_numeric - +by.TG.value_numeric / 2.2;
    out.push({ ok: Math.abs(+by.LDL.value_numeric - f) <= 0.1, text: `LDL ${by.LDL.value_numeric} mmol/L agrees with Friedewald (${f.toFixed(1)})` });
  }
  return out;
}

// ── Gaya drafts the report and the result e-mail for every request whose checks pass ──
orders.forEach(o => {
  if (o.status === 'rejected') return;
  const benchDone = new Date(Math.max(...o.results.map(r => T(r.tested_at))));
  const ok = checksFor(o).every(c => c.ok);
  o.report = { status: !ok ? 'held' : o.status === 'released' ? 'final' : 'draft', draftedAt: new Date(benchDone.getTime() + 3 * 60000), previewedBy: new Set() };
  o.email = o.status === 'released' ? { status: 'sent', at: new Date(Math.max(...o.results.map(r => T(r.released_at))) + 2 * 60000) } : ok ? { status: 'drafted' } : null;
  if (o.report.status === 'draft') {
    const p = patients[o.patient_id];
    state.audit.push({ at: o.report.draftedAt, actor: 'Gaya', kind: 'gaya', action: 'report.drafted', model: state.model,
      detail: `${p.lab_patient_id}: checks passed; draft report and result e-mail prepared on the lab template and attached to the record` });
  }
});
state.audit.sort((a, b) => b.at - a.at);
const pendingDrafts = () => orders.filter(o => o.report?.status === 'draft').length;

function metrics() {
  const live = orders.filter(o => o.status !== 'rejected');
  const released = results.filter(r => r.status === 'released');
  const tat = live.filter(o => o.status === 'released').map(o => mins(T(o.received_at), new Date(Math.max(...o.results.map(r => T(r.released_at))))));
  const byTest = {};
  released.forEach(r => { const o = orders.find(x => x.id === r.order_id); if (r.test_code === 'MANTOUX') return; (byTest[r.test_code] ||= []).push(mins(T(o.received_at), T(r.released_at))); });
  return { orders: orders.length, rejected: orders.filter(o => o.status === 'rejected').length, released: released.length, pending: results.filter(r => r.status === 'awaiting_approval').length, tat: median(tat), byTest };
}

function barsV(labels, vals) {
  const W = 520, H = 210, pad = 30, max = Math.max(4, ...vals), bw = (W - pad * 2) / labels.length;
  const y = v => H - 26 - (v / max) * (H - 50);
  let g = '';
  for (let t = 0; t <= max; t += Math.ceil(max / 4)) g += `<line x1="${pad}" x2="${W - 8}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line-soft)"/><text x="${pad - 8}" y="${y(t) + 4}" text-anchor="end">${t}</text>`;
  labels.forEach((l, i) => { const x = pad + i * bw + bw * 0.22; g += `<rect x="${x}" y="${y(vals[i])}" width="${bw * 0.56}" height="${H - 26 - y(vals[i])}" rx="4" fill="var(--accent)"/><text x="${x + bw * 0.28}" y="${y(vals[i]) - 6}" text-anchor="middle" style="fill:var(--fg)">${vals[i]}</text><text x="${x + bw * 0.28}" y="${H - 8}" text-anchor="middle">${l}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Requests per day: ${labels.map((l, i) => `${l} ${vals[i]}`).join(', ')}">${g}</svg>`;
}
function barsH(rows) {
  const W = 520, rowH = 26, H = rows.length * rowH + 30, left = 74, max = Math.max(...rows.map(r => r[1]), 60);
  const x = v => left + (v / max) * (W - left - 60);
  let g = '';
  [0, 60, 120, 180, 240].filter(t => t <= max).forEach(t => g += `<line x1="${x(t)}" x2="${x(t)}" y1="4" y2="${H - 22}" stroke="var(--line-soft)"/><text x="${x(t)}" y="${H - 6}" text-anchor="middle">${t}</text>`);
  rows.forEach(([k, v], i) => { const yy = 6 + i * rowH; g += `<text x="${left - 8}" y="${yy + 14}" text-anchor="end">${k}</text><rect x="${left}" y="${yy + 3}" width="${x(v) - left}" height="15" rx="3" fill="${v > 150 ? 'var(--warn)' : 'var(--accent)'}"/><text x="${x(v) + 6}" y="${yy + 14}" style="fill:var(--fg)">${Math.round(v)}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Median turnaround in minutes by test">${g}</svg><div class="legend"><span><span class="sw" style="background:var(--accent)"></span>Within 2.5 h</span><span><span class="sw" style="background:var(--warn)"></span>Over 2.5 h</span></div>`;
}

  return '<span class="pill p-warn">Awaiting approval</span>';
}
function flagPill(r) {
  const m = { N: ['Normal','p-ok'], H: ['High','p-warn'], L: ['Low','p-info'], C: ['Critical','p-crit'], POS: ['Positive','p-warn'], NEG: ['Negative','p-ok'] }[r.flag];
  return m ? `<span class="pill ${m[1]}">${m[0]}</span>` : '<span class="pill p-mute">Reported</span>';

function keyFlags(o) {

  return o.status === 'rejected' ? esc(o.reject_reason) : (f.length ? f.slice(0, 3).join(' · ') + (f.length > 3 ? ' …' : '') : 'Within range');
}

function viewQC() {
  const runs = DATA.qc_runs.filter(q => q.test_code === state.qcTest && q.level === state.qcLevel);
  const opts = [['FBG','L1'],['FBG','L2'],['TC','L1'],['TC','L2']];
  return `
  <div class="head"><div><div class="eyebrow">Analyser Chem-1 · daily run before the first patient</div><h1>Quality control</h1></div>
  <div class="filters" role="group" aria-label="Control">${opts.map(([t, l]) => `<button type="button" class="chip" data-qc="${t}|${l}" aria-pressed="${state.qcTest === t && state.qcLevel === l}">${t} ${l}</button>`).join('')}</div></div>
  <section class="panel chart" aria-labelledby="h-lj"><div><h2 id="h-lj">Levey-Jennings: ${state.qcTest} control ${state.qcLevel}</h2><p class="sub">Target ${runs[0].target_mean} ± ${runs[0].target_sd} ${state.qcTest === 'FBG' || state.qcTest === 'TC' ? 'mmol/L' : ''}</p></div>
  ${lj(runs)}
  <div class="legend"><span><span class="sw" style="background:var(--accent)"></span>Within ±2 SD</span><span><span class="sw" style="background:var(--warn)"></span>1-2s warning (beyond ±2 SD)</span><span><span class="sw" style="background:var(--crit)"></span>1-3s rejection (beyond ±3 SD)</span></div></section>
  <section class="panel" aria-labelledby="h-west"><h2 id="h-west">Westgard review</h2>${westgard()}</section>`;
}
function lj(runs) {
  const W = 640, H = 250, L = 52, R = 16, top = 14, bot = 34, m = +runs[0].target_mean, sd = +runs[0].target_sd;
  const y = v => top + (1 - (v - (m - 3.5 * sd)) / (7 * sd)) * (H - top - bot);
  const x = i => L + i * ((W - L - R) / (runs.length - 1));
  let g = '';
  [-3, -2, -1, 0, 1, 2, 3].forEach(k => { const yy = y(m + k * sd); g += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" stroke="${k === 0 ? 'var(--muted)' : Math.abs(k) >= 2 ? 'var(--warn)' : 'var(--line)'}" stroke-dasharray="${k === 0 ? '' : '4 4'}"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${k === 0 ? 'x̄' : (k > 0 ? '+' : '') + k + 's'}</text>`; });
  g += `<polyline fill="none" stroke="var(--accent)" stroke-width="1.6" points="${runs.map((r, i) => `${x(i)},${y(+r.value)}`).join(' ')}"/>`;
  runs.forEach((r, i) => { const z = Math.abs((+r.value - m) / sd); const c = z > 3 ? 'var(--crit)' : z > 2 ? 'var(--warn)' : 'var(--accent)'; const d = T(r.run_at);
    g += `<circle cx="${x(i)}" cy="${y(+r.value)}" r="${z > 2 ? 6 : 4.5}" fill="${c}" stroke="var(--surface)" stroke-width="2"/><text x="${x(i)}" y="${H - 12}" text-anchor="middle">${d.toLocaleDateString('en-GB',{weekday:'short',timeZone:'Africa/Lagos'})}</text>`; });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Levey-Jennings chart, ${runs.length} runs">${g}</svg>`;
}
function westgard() {
  const flagged = DATA.qc_runs.filter(q => Math.abs((+q.value - +q.target_mean) / +q.target_sd) > 2);
  if (!flagged.length) return '<p class="note">No rule violations this week.</p>';
  return flagged.map(q => { const z = ((+q.value - +q.target_mean) / +q.target_sd); return `<div class="proc"><p><span class="pill p-warn">1-2s warning</span> <strong>${q.test_code} ${q.level}</strong> on ${fmt(T(q.run_at))}: ${q.value} (${z > 0 ? '+' : ''}${z.toFixed(1)} SD).</p>
  <p class="cite">Source: <b>SOP-QC-01 §3</b> · A single control beyond ±2 SD is a warning: inspect neighbouring runs and the other level before releasing patient results. Reject the run on 1-3s, 2-2s or R-4s.</p>
  <p class="note">Gaya checked the other level and the runs either side: no 2-2s or R-4s pattern. Patient results were released after the chief's review.</p></div>`; }).join('');
}

// Opening a preview counts as the current user having seen this exact draft.
function markPreviewed(o) {
  if (o.report?.status !== 'draft' || o.report.previewedBy.has(state.user)) return;
  o.report.previewedBy.add(state.user);
  audit('report.previewed', `${patients[o.patient_id].lab_patient_id}: draft report opened for review`);
  if (!$('#drawer').hidden) openOrder(o.id);
}
function approveAndSend(id) {
  const o = orders.find(x => x.id === id), p = patients[o.patient_id];
  if (!isChief() || o.report?.status !== 'draft' || !o.report.previewedBy.has(state.user)) return;
  const at = new Date(NOW.getTime() + state.audit.length * 60000);
  o.results.forEach(r => { r.status = 'released'; r.approved_by = state.user; r.approved_at = at.toISOString(); r.released_at = at.toISOString(); });
  o.status = 'released'; o.report.status = 'final'; o.email = { status: 'sent', at: new Date(at.getTime() + 60000) };
  audit('report.approved', `${p.lab_patient_id} ${p.full_name}: previewed report approved (${o.results.length} result(s))`);
  audit('report.finalised', `Signed report ${fileName(o, p)} issued (DOCX + PDF)`, 'gaya');
  audit('email.sent', `Result e-mail with ${fileName(o, p)} sent to ${p.email} (demo: nothing leaves this page)`, 'gaya');
  toast('Approved and sent. In the demo, nothing leaves this page'); render();
  if (!$('#drawer').hidden) openOrder(id);
}

  openModal(`<div class="modalbar"><strong id="modalTitle">Result e-mail · ${o.email.status === 'sent' ? `sent ${fmt(o.email.at)}` : 'draft, waiting for the chief scientist'}</strong><span class="actions">${approveBar(o)}<button type="button" class="btn small" id="closeModal">Close</button></span></div>
    <section class="mail" aria-label="E-mail draft">
      <div class="mailhead"><span>From</span><div>${esc(LAB.assistant_name)}, ${esc(LAB.name)}</div><span>To</span><div class="mono">${esc(p.email)}</div><span>Subject</span><div><b>Your test results are ready · MITOCHRONAiLab</b></div></div>
      <div class="mailbody">${esc(emailText(o))}</div>
      <div class="attach"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
        <span style="flex:1 1 220px;min-width:0"><b>${esc(fileName(o, p))}</b><br><span class="sub">PDF · password-protected with the patient's date of birth</span></span></div>
    </section>
    <p class="modalbar" style="font-size:13px;opacity:.9">Attached report, as the patient will see it:</p>
    ${reportHTML(o)}`);
  bindApproveBar(o, openEmail);
}
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) { e.stopImmediatePropagation(); closeModal(); } }, true);

// ── Events ────────────────────────────────────────────────────────────────
function bindView() {
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { state.filter = b.dataset.filter; render(); });
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => go(b.dataset.go));
  document.querySelectorAll('[data-preview]').forEach(b => b.onclick = e => { e.stopPropagation(); openReport(b.dataset.preview); });
  document.querySelectorAll('[data-preview]').forEach(b => b.onkeydown = e => e.stopPropagation());
  document.querySelectorAll('tr[data-order]').forEach(tr => { tr.onclick = () => openOrder(tr.dataset.order); tr.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openOrder(tr.dataset.order); } }; });
  document.querySelectorAll('[data-qc]').forEach(b => b.onclick = () => { [state.qcTest, state.qcLevel] = b.dataset.qc.split('|'); render(); });
  document.querySelectorAll('[data-resolve]').forEach(b => b.onclick = () => {
    const e = exceptions.find(x => x.id === b.dataset.resolve), opt = e.options[+b.dataset.opt];
    if (!isChief() && e.sev === 'crit') { toast('A chief scientist must decide critical holds'); return; }
    e.status = 'resolved'; e.resolution = opt[1]; e.by = staff[state.user].display_name; e.at = new Date(NOW.getTime() + state.audit.length * 60000);
    audit('discrepancy.resolved', `${e.patient.lab_patient_id} ${e.type}: ${opt[1]}`);
    toast('Decision recorded'); render();
  });
  document.querySelectorAll('input[name="model"]').forEach(r => r.onchange = () => { state.model = r.value; audit('settings.model', `Gaya's model source set to: ${modelLabel(r.value)}`); toast('Model source updated'); render(); });
  const c = $('#comments'); if (c) c.onchange = () => { state.comments = c.checked; audit('settings.comments', `Optional AI-drafted comments turned ${c.checked ? 'on' : 'off'}`); render(); };
}
function go(v) { state.view = v; try { localStorage.setItem('mcl.view', v); } catch (e) {} render(); $('#view').focus(); }
$('#nav').addEventListener('click', e => { const b = e.target.closest('button[data-view]'); if (b) go(b.dataset.view); });
$('#drawer').addEventListener('click', e => { if (e.target.id === 'drawer') closeSheet(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#drawer').hidden) closeSheet(); });
$('#who').innerHTML = DATA.staff.map(s => `<option value="${s.id}">${esc(s.display_name)}${s.role === 'chief_scientist' ? ' (chief)' : ''}</option>`).join('');
$('#who').onchange = e => { state.user = e.target.value; audit('session.switch', `Signed in as ${staff[state.user].display_name}`); toast(`Signed in as ${staff[state.user].display_name}`); render(); };
$('#labName').textContent = DATA.labs[0].name;
state.qcTest = 'FBG'; state.qcLevel = 'L2';
try { const v = localStorage.getItem('mcl.view'); if (v && NAV.some(n => n[0] === v)) state.view = v; } catch (e) {}
const loc = (location.hash || '').slice(1); if (NAV.some(n => n[0] === loc)) state.view = loc;
render();
</script>
